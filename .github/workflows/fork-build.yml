name: Fork build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Stamped in CI only, so upstream version bumps never conflict in the sync merge.
      - name: Stamp fork version
        id: version
        run: |
          base=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$base"
          ver="$base-fork.${{ github.run_number }}"
          sed -i "s/^\( *versionName = \)\".*\"$/\1\"$ver\"/" app/build.gradle.kts
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/keystore.jks

      - name: Test and build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: katapult-fork-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

      # Obtainium follows these releases.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Katapult ${{ steps.version.outputs.version }}
          body: Fork build of ${{ github.sha }} (upstream gezimos/Katapult + network location line).
          files: app/build/outputs/apk/release/*.apk
